<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <title>Zym — sem conexão</title>
    <style>
      *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#050505;color:#f7f7f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px;text-align:center}.card{width:min(100%,360px);padding:30px;border:1px solid #2b2c26;border-radius:28px;background:#121310}.icon{display:grid;width:62px;height:62px;margin:0 auto 18px;place-items:center;border-radius:19px;background:#dfff37;color:#080905;font-size:32px;font-weight:900;font-style:italic}h1{margin:0 0 8px;font-size:27px;letter-spacing:-.05em}p{margin:0;color:#8d8f86;font-size:13px;line-height:1.55}button{width:100%;min-height:50px;margin-top:22px;border:0;border-radius:15px;background:#dfff37;color:#080905;font-weight:750}small{display:block;margin-top:13px;color:#5f615a;font-size:10px}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon">Z</div>
      <h1>Sem conexão</h1>
      <p>O Zym não usa o navegador como banco. Reconecte-se para carregar e salvar seus treinos com segurança.</p>
      <button onclick="location.reload()">Tentar novamente</button>
      <small>Seus dados já salvos continuam no Supabase.</small>
    </main>
  </body>
</html>
